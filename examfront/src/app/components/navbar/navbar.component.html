<mat-toolbar color="accent">
    <a 
    *ngIf="!isLoggedIn"
    routerLink="/"
    mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon">
      <mat-icon>menu_book</mat-icon>
    </a>
    <span>Examportal</span>
    <span class="example-spacer"></span>
    <a 
    *ngIf="!isLoggedIn"
    [routerLink]="'/login'"    
    mat-icon-button class="example-icon favorite-icon mr20" aria-label="Example icon-button with heart icon">
        Login      
    </a>
    <a
    *ngIf="!isLoggedIn"
    [routerLink]="'/signup'"
     mat-icon-button class="example-icon favorite-icon mr40 ml20"
     aria-label="Example icon-button with heart icon">
      Register
</a>

<a
(click)="logout()"
    *ngIf="isLoggedIn"    
     mat-icon-button class="example-icon favorite-icon mr40"
     aria-label="Example icon-button with heart icon">
      Logout
</a>

<button
    *ngIf="isLoggedIn && user"    
     mat-icon-button style="margin-right: 150px"
     aria-label="Example icon-button with heart icon">
      {{ user.userName }}
</button>
  </mat-toolbar>
