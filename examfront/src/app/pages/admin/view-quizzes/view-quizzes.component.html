<section class="quiz-search" aria-label="Search quizzes">
    <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search quizzes</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchTermChange($event)" (keyup.enter)="search()"
               placeholder="Title, description, or category">
        <button *ngIf="searchTerm" mat-icon-button matSuffix type="button"
                aria-label="Clear search" (click)="clearSearch()">
            <mat-icon>close</mat-icon>
        </button>
    </mat-form-field>
</section>

<p class="search-status" *ngIf="searching">Loading quizzes...</p>
<p class="search-status" *ngIf="!searching && searchTerm && quizzes.length === 0">No quizzes match “{{searchTerm}}”.</p>

<mat-card class="mt10" *ngFor="let q of quizzes">
    <div mat-card-avatar  class="example-header-image"></div>
    <mat-card-header>
        <mat-card-title>
            {{q.title}}
        </mat-card-title>
        <mat-card-subtitle>
            {{q.category.title}}
        </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
        <p>{{q.description}}</p>
    </mat-card-content>

    <mat-card-actions>
        <button [routerLink]="'/admin/view-questions/' +q.qId + '/'+ q.title" mat-flat-button color="accent">Questions</button>
        <button mat-stroked-button color="accent" class="ml20">
            Max Marks:{{ q.maxMarks}}</button>
            <button mat-stroked-button color="accent" class="ml20">
                Display Questions:{{q.numberOfQuestions}}</button>
            <button [routerLink]="'/admin/quiz/' + q.qId" mat-flat-button color="accent" class="ml20">update</button>        
            <button [routerLink]="'/admin/attempts'" mat-flat-button color="accent" class="ml20">Attempts</button>
            <button mat-flat-button color="warn" class="ml10" (click)="deleteQuiz(q.qId)">Delete</button>        
    </mat-card-actions>
</mat-card>

<div class="container text-center mt20">
    <button routerLink="/admin/add-quiz" mat-raised-button color="accent">Add New Quiz</button>
</div>
