<mat-card class="sidebar-shell admin-sidebar">
    <header class="sidebar-header">
        <span class="sidebar-mark"><mat-icon>space_dashboard</mat-icon></span>
        <div>
            <p class="sidebar-eyebrow">EXAM PORTAL</p>
            <h2>Admin workspace</h2>
        </div>
    </header>

    <nav aria-label="Administrator navigation">
        <p class="menu-section-title">WORKSPACE</p>
        <mat-action-list>
            <button routerLink="/admin" routerLinkActive="active-menu-item" [routerLinkActiveOptions]="{exact: true}" mat-list-item>
                <mat-icon mat-list-icon>home</mat-icon><span>Home</span>
            </button>
            <button mat-list-item routerLink="/admin/categories" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>category</mat-icon><span>Categories</span>
            </button>
            <button mat-list-item routerLink="/admin/add-category" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>add_circle_outline</mat-icon><span>Add Category</span>
            </button>
            <button mat-list-item routerLink="/admin/quizzes" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>quiz</mat-icon><span>Quizzes</span>
            </button>
            <button mat-list-item routerLink="/admin/add-quiz" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>add</mat-icon><span>Add Quiz</span>
            </button>
            <button mat-list-item routerLink="/admin/attempts" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>assessment</mat-icon><span>All user test results</span>
            </button>
        </mat-action-list>

        <p class="menu-section-title">ACCOUNT</p>
        <mat-action-list>
            <button mat-list-item routerLink="/admin/profile" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>account_circle</mat-icon><span>Profile</span>
            </button>
            <button mat-list-item routerLink="/admin/change-password" routerLinkActive="active-menu-item">
                <mat-icon mat-list-icon>settings</mat-icon><span>Settings</span>
            </button>
            <button type="button" mat-list-item class="logout-item" (click)="logout()">
                <mat-icon mat-list-icon>logout</mat-icon><span>Logout</span>
            </button>
        </mat-action-list>
    </nav>
</mat-card>
