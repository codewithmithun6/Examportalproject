<mat-card>
    <h1 class="text-center mt20">Verify the code sent to {{email}}</h1>
    <!-- {{ emailAddress | json }} -->
    
    <mat-card-content>
        <div class="bootstrap-wrapper">
            <div class="row">
                <div class="col-md-6 offset-md-4">
                    <form #otpForm="ngForm" (ngSubmit)="formSubmit()">
                        <mat-form-field class="w100" appearance="outline">
                            <mat-label>Enter OTP</mat-label>
                            <input
                            autofocus 
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            name="OTP"                                                       
                            matInput placeholder="Enter OTP"
                            [(ngModel)]="OTP"
                            
                            required
                            >                            
                        </mat-form-field>                       
                       

                        <div class="container text-center mt15">
                            <button mat-raised-button color="accent" [disabled]="otpForm.invalid || submitting">
                                {{ submitting ? 'Verifying...' : 'Verify OTP' }}
                            </button>
                            <button type="button" style="margin-left: 20px" mat-raised-button color="warn"
                                    [disabled]="submitting" (click)="resendCode()">Resend</button>
                        </div>

                        

                    </form>

                </div>
            </div>
        </div>

    </mat-card-content>
</mat-card>
