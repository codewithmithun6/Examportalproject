<mat-card>
    <h1 class="text-center mt20">Change Password</h1>
    <!-- {{ user | json }} -->
    
    <mat-card-content>
        <div class="bootstrap-wrapper">
            <div class="row">
                <div class="col-md-6 offset-md-4">
                    <form (ngSubmit)="formSubmit()">
                        <mat-form-field class="w100" appearance="outline">
                            <mat-label>Enter New Password</mat-label>
                            <input
                            autofocus 
                            type="password" 
                            name="newPassword"                            
                            matInput placeholder="Enter Here"
                            
                            required
                            >                            
                        </mat-form-field>  
                        
                        <mat-form-field class="w100" appearance="outline">
                            <mat-label>Enter confirm new Password</mat-label>
                            <input
                            autofocus 
                            type="password" 
                            name="confirmPassword"                            
                            matInput placeholder="Enter confirm new password"
                            
                            required
                            >                            
                        </mat-form-field>

                        <div class="container text-center mt15">
                            <button mat-raised-button color="accent">Reset Password</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </mat-card-content>
</mat-card>
