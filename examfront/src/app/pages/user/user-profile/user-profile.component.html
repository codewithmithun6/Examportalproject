<mat-card *ngIf="user">
    <h1 class="ml20 mt20"><b>Your profile details</b></h1>
    <!-- {{ user | json }} -->
    <mat-card-content>
        <div class="bootstrap-wrapper">
            <div class="container">
                <div class="container text-center">
                    <img [src]="profileImage" 
                    alt="Profile picture"
                    class="profile-image"
                    >
                    <h1> {{user.firstName}} {{user.lastName}} </h1>
                    
                </div>
                <div class="row">
                    <div class="col-md-10 offset-md-1">
                        <!-- table details -->

                        <table class="table text-center">
                            <tr>
                                <td>Username</td>
                                <td>{{user.userName}} </td>
                            </tr>
                            <tr>
                                <td>Userid</td>
                                <td>Exam00{{user.id}} </td>
                            </tr>

                            <tr>
                                <td>Email</td>
                                <td>{{user.email}} </td>
                            </tr>
                            <tr>
                                <td>Mobile number</td>
                                <td>{{user.phone}} </td>
                            </tr>

                            <tr>
                                <td>Role</td>
                                <td>{{user.authorities[0].authority}} </td>
                            </tr>

                            <tr>
                                <td>Status</td>
                                <td>{{user.enable ? "ACTIVE" : "NOTACTIVE"}} </td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
    </mat-card-content>
    <div class="text-center ">
        
            <button [routerLink]="'/user-dashboard/update-user-profile/' + user.id" mat-raised-button color="primary">UPDATE</button>
            <button class="ml20" mat-raised-button color="accent" (click)="shareProfile()">SHARE</button>
        
    </div>
    
    
</mat-card>
