<mat-card>
    
    <mat-action-list>
        <button mat-list-item routerLink="/user-dashboard/user-profile/">
            <mat-icon mat-list-icon>account_circle</mat-icon> Profile
        </button>

        <button mat-list-item routerLink="/user-dashboard/attempts">
            <mat-icon mat-list-icon>assessment</mat-icon> Quiz History
        </button>


        <button mat-list-item [routerLink]="'/user-dashboard/change-password/' + userName">
            <mat-icon mat-list-icon>settings</mat-icon> Settings
        </button>

        <!-- <a

[routerLink]="'/user-dashboard/change-password'" 

 mat-button color="primary">Settings
 <mat-icon mat-list-icon>account_circle</mat-icon>
</a> -->
        
        <div mat-suheader class="ml20">
            
                <h3>Available Category</h3>
            
        </div>

        <button mat-list-item routerLink="/user-dashboard/0">
            <mat-icon mat-list-icon>all_inbox</mat-icon> All Quizzes
        </button>

        <button [routerLink]="'/user-dashboard/' + c.cid"
        mat-list-item *ngFor="let c of categories">
            <mat-icon mat-list-icon>quiz</mat-icon> {{c.title}}
        </button>
        
    </mat-action-list>
</mat-card>
