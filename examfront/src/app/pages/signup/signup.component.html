<div class="bootstrap-wrapper">
    <div class="container">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <mat-card>
                    <mat-card-content>

                <div class="container text-center">
                    <img src="../../../assets/logo.jpg" alt="">
                </div>
                <h1 class="text-center">{{ otpSent ? 'Verify Your Email' : 'Register Here' }}</h1>

                <form #signupForm="ngForm" (ngSubmit)="formSubmit()">
                    <!-- username field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>User Name</mat-label>
                        <input
                        required 
                        [(ngModel)]="user.userName"
                        name="userName"                        
                        matInput placeholder="Enter here" [disabled]="otpSent" maxlength="100">  
                        <mat-hint>User name must be unique !!</mat-hint>                                            
                    </mat-form-field>
                    
                    <!-- password field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>User Password</mat-label>
                        <input
                        required
                        [(ngModel)]="user.password"
                        name="password"
                         type="password" matInput placeholder="Enter here" [disabled]="otpSent" maxlength="72">                                              
                      </mat-form-field>
                      
                    <!-- firstName field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>First Name</mat-label>
                        <input
                        required
                        [(ngModel)]="user.firstName"
                        name="firstName"
                        matInput placeholder="Enter here" [disabled]="otpSent" maxlength="100">                                              
                      </mat-form-field>
                      
                    <!-- lastName field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>Last Name</mat-label>
                        <input
                        required
                        [(ngModel)]="user.lastName"
                        name="lastName"
                        matInput placeholder="Enter here" [disabled]="otpSent" maxlength="100">                                              
                      </mat-form-field>
                      
                    <!-- email field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>Email Address</mat-label>
                        <input
                        required
                        [(ngModel)]="user.email"
                        name="email"
                        type="email" matInput placeholder="Enter here" [disabled]="otpSent" maxlength="150">                                              
                      </mat-form-field>
                      
                    <!-- phone field -->
                    <mat-form-field class="full-width" appearance="outline">
                        <mat-label>Phone</mat-label>
                        <input
                        required
                        [(ngModel)]="user.phone"
                        name="phone"
                        type="tel" matInput placeholder="Enter here" [disabled]="otpSent" maxlength="25">                                              
                      </mat-form-field>

                    <mat-form-field *ngIf="otpSent" class="full-width" appearance="outline">
                        <mat-label>Email verification code</mat-label>
                        <input matInput name="otp" [(ngModel)]="otp" inputmode="numeric"
                               autocomplete="one-time-code" maxlength="6" required>
                        <mat-hint>Enter the six-digit code sent to {{user.email}}.</mat-hint>
                    </mat-form-field>
                      
                    <div class="container text-center">
                        <button type="submit" mat-raised-button color="primary" [disabled]="submitting">
                            {{ submitting ? 'Please wait...' : (otpSent ? 'Verify and Register' : 'Send Verification Code') }}
                        </button>
                        <button *ngIf="otpSent" class="ml20" type="button" mat-raised-button
                                [disabled]="submitting" (click)="sendOtp()">Resend Code</button>
                        <button class="ml20" type="button" mat-raised-button color="accent"
                                [disabled]="submitting" (click)="resetRegistration()">Edit Details</button>
                    </div>
                </form>
            </mat-card-content>
            </mat-card>
            </div>
        </div>
    </div>
</div>
