<mat-card>
    <h1 class="text-center mt20">Reset your Password</h1>
    <!-- {{ emailAddress | json }} -->
    
    <mat-card-content>
        <div class="bootstrap-wrapper">
            <div class="row">
                <div class="col-md-6 offset-md-4">
                    <form (ngSubmit)="formSubmit()">
                        <mat-form-field class="w100" appearance="outline">
                            <mat-label>Enter Email Address</mat-label>
                            <input
                            autofocus 
                            type="email" 
                            name="emailAddress"                                                       
                            matInput placeholder="Enter your registered email address"
                            [(ngModel)]="emailAddress"                           
                            
                            required
                            >                            
                        </mat-form-field>                       
                       

                        <div class="container text-center mt15">
                            <button mat-raised-button color="accent">Send OTP</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </mat-card-content>
</mat-card>
